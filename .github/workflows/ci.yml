name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install flask pillow

      - name: Syntax checks
        run: |
          python -m py_compile server.py
          node --check public/webgpu-engine.js || true   # node may be absent; skip then
          bash -n run.sh setup.sh

      - name: Run full demo pipeline test
        run: bash scripts/ci_test.sh
